services:
  apfiscal-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - apfiscal-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [apfiscal]

  apfiscal-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    depends_on:
      apfiscal-redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      SUPABASE_URL: ${SUPABASE_URL:?obrigatoria}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?obrigatoria}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?obrigatoria}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?obrigatoria}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?obrigatoria}
      CERTIFICATE_ENCRYPTION_KEY: ${CERTIFICATE_ENCRYPTION_KEY:?obrigatoria}
      NFE_ENVIRONMENT: ${NFE_ENVIRONMENT:-1}
      NFE_TIMEOUT_MS: ${NFE_TIMEOUT_MS:-30000}
      NFE_RECONCILIATION_BATCH_SIZE: ${NFE_RECONCILIATION_BATCH_SIZE:-50}
      APFISCAL_BASE_URL: ${APFISCAL_BASE_URL:-}
      APFISCAL_DEFAULT_API_KEY: ${APFISCAL_DEFAULT_API_KEY:-}
      APFISCAL_CADASTRO_TOKEN: ${APFISCAL_CADASTRO_TOKEN:-}
      APFISCAL_ENC_KEY: ${APFISCAL_ENC_KEY:-}
      PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?obrigatoria}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      REDIS_URL: redis://apfiscal-redis:6379/0
      TOTVS_SQL_HOST: ${TOTVS_SQL_HOST:-}
      TOTVS_SQL_PORT: ${TOTVS_SQL_PORT:-1433}
      TOTVS_SQL_DATABASE: ${TOTVS_SQL_DATABASE:-}
      TOTVS_SQL_USER: ${TOTVS_SQL_USER:-}
      TOTVS_SQL_PASSWORD: ${TOTVS_SQL_PASSWORD:-}
      TOTVS_SQL_ENCRYPT: ${TOTVS_SQL_ENCRYPT:-true}
      TOTVS_SQL_TRUST_SERVER_CERTIFICATE: ${TOTVS_SQL_TRUST_SERVER_CERTIFICATE:-false}
      TOTVS_SQL_CONNECTION_TIMEOUT_MS: ${TOTVS_SQL_CONNECTION_TIMEOUT_MS:-15000}
      TOTVS_SQL_REQUEST_TIMEOUT_MS: ${TOTVS_SQL_REQUEST_TIMEOUT_MS:-60000}
      TOTVS_SQL_POOL_MAX: ${TOTVS_SQL_POOL_MAX:-5}
      TOTVS_COLIGADAS: ${TOTVS_COLIGADAS:-1,2}
      TOTVS_INITIAL_SYNC_DATE: ${TOTVS_INITIAL_SYNC_DATE:-2000-01-01T00:00:00.000Z}
      TOTVS_WRITES_ENABLED: ${TOTVS_WRITES_ENABLED:-false}
      TOTVS_CONNECTION_KEYS: ${TOTVS_CONNECTION_KEYS:-TOTVS_GRANJA,TOTVS_GRANJA_HOMOLOG}
      TOTVS_DEFAULT_CONNECTION_KEY: ${TOTVS_DEFAULT_CONNECTION_KEY:-TOTVS_GRANJA}
      TOTVS_CONNECTION_TOTVS_GRANJA_DEFAULT_FILIAL: ${TOTVS_CONNECTION_TOTVS_GRANJA_DEFAULT_FILIAL:-1}
      TOTVS_CONNECTION_TOTVS_GRANJA_NFE_ENTRY_CODTMV: ${TOTVS_CONNECTION_TOTVS_GRANJA_NFE_ENTRY_CODTMV:-1.2.11}
      TOTVS_CONNECTION_TOTVS_GRANJA_NFSE_ENTRY_CODTMV: ${TOTVS_CONNECTION_TOTVS_GRANJA_NFSE_ENTRY_CODTMV:-1.2.30}
      TOTVS_CONNECTION_TOTVS_GRANJA_NFSE_PRODUCT_CODE: ${TOTVS_CONNECTION_TOTVS_GRANJA_NFSE_PRODUCT_CODE:-001.01.01.000001}
      TOTVS_CONNECTION_TOTVS_GRANJA_INTEGRATION_USER: ${TOTVS_CONNECTION_TOTVS_GRANJA_INTEGRATION_USER:-APFISCAL}
      TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_DESCRIPTION: ${TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_DESCRIPTION:-TOTVS_GRANJA_HOMOLOG}
      TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_HOST: ${TOTVS_SQL_HOST:-}
      TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_PORT: ${TOTVS_SQL_PORT:-1433}
      TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_DATABASE: ${TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_DATABASE:-CorporeRM_Teste}
      TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_DEFAULT_FILIAL: ${TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_DEFAULT_FILIAL:-1}
      TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_NFE_ENTRY_CODTMV: ${TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_NFE_ENTRY_CODTMV:-1.2.11}
      TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_NFSE_ENTRY_CODTMV: ${TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_NFSE_ENTRY_CODTMV:-1.2.30}
      TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_NFSE_PRODUCT_CODE: ${TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_NFSE_PRODUCT_CODE:-001.01.01.000001}
      TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_INTEGRATION_USER: ${TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_INTEGRATION_USER:-APFISCAL}
      TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_USER: ${TOTVS_SQL_USER:-}
      TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_PASSWORD: ${TOTVS_SQL_PASSWORD:-}
      TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_COLIGADAS: ${TOTVS_COLIGADAS:-1,2}
      TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_ENCRYPT: ${TOTVS_SQL_ENCRYPT:-true}
      TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_TRUST_SERVER_CERTIFICATE: ${TOTVS_SQL_TRUST_SERVER_CERTIFICATE:-false}
      TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_WRITES_ENABLED: ${TOTVS_CONNECTION_TOTVS_GRANJA_HOMOLOG_WRITES_ENABLED:-false}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [apfiscal]

  apfiscal-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?obrigatoria}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?obrigatoria}
    restart: unless-stopped
    depends_on:
      apfiscal-api:
        condition: service_healthy
    ports:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://apfiscal-api:3001
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?obrigatoria}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?obrigatoria}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?obrigatoria}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?obrigatoria}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [apfiscal]

networks:
  apfiscal:
    driver: bridge

volumes:
  apfiscal-redis-data:
